<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>NAI Metadata Reader</title>
  <link rel="stylesheet" href="styles-profile-v2.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand-block">
      <p class="eyebrow">YAMMO META</p>
    </div>
    <div class="header-actions">
      <button id="themeBtn" class="ghost" type="button">다크 모드</button>
    </div>
  </header>

  <main class="shell app-layout">
    <aside class="sidebar">
      <section class="profile-card panel">
        <div class="profile-top">
          <button id="profilePhotoBtn" class="profile-photo-btn" type="button" title="프로필 이미지 변경">
            <img id="profilePhotoImage" alt="프로필 이미지" hidden />
            <span id="profilePhotoPlaceholder">YM</span>
          </button>
          <input id="profilePhotoInput" type="file" accept="image/png,image/jpeg,image/webp" hidden />
          <div><strong>YAMMO</strong></div>
        </div>
        <div class="profile-stats">
          <div><b id="sidebarImageCount">0</b><span>IMAGES</span></div>
          <div><b>LOCAL</b><span>MODE</span></div>
        </div>
      </section>

      <section id="dropZone" class="dropzone panel" tabindex="0" aria-label="이미지 업로드 영역">
        <input id="fileInput" type="file" accept="image/png,image/webp,image/jpeg,.png,.webp,.jpg,.jpeg" multiple hidden />
        <div class="drop-icon">＋</div>
        <strong>이미지 추가</strong>
        <span>PNG / WebP / JPEG · 여러 장 가능</span>
        <button id="chooseBtn" type="button">파일 선택</button>
      </section>

      <section class="control-card panel">
        <div class="panel-head compact">
          <h2>보기 옵션</h2>
        </div>
        <label class="range-wrap stacked">
          <span>미리보기 크기 <b id="previewWidthValue">400px</b></span>
          <input id="previewWidth" type="range" min="180" max="900" value="400" step="20" />
        </label>
        <div class="toolbar-actions stacked-actions">
          <button id="dedupeBtn" class="secondary" type="button">중복 제거</button>
          <button id="copyAllBtn" class="secondary" type="button">전체 복사</button>
          <button id="resetBtn" class="danger" type="button">초기화</button>
        </div>
      </section>

      <section class="image-list panel">
        <div class="panel-head compact">
          <h2>이미지 목록</h2>
          <span id="imageCount" class="count"></span>
        </div>
        <div id="emptyListHint" class="list-hint">아직 추가된 이미지가 없습니다.</div>
        <div id="imageList"></div>
      </section>
    </aside>

    <section class="content-area">
      <section id="emptyState" class="empty panel">
        <strong>아직 선택된 이미지가 없어요.</strong>
        <p>왼쪽의 파일 선택 버튼 또는 드래그앤드롭으로 이미지를 추가해 주세요.</p>
      </section>

      <article id="resultPane" class="result-pane" hidden></article>
    </section>
  </main>

  <template id="fieldTemplate">
    <section class="field-card panel">
      <div class="field-head">
        <h3></h3>
        <button class="copy-btn secondary" type="button">복사</button>
      </div>
      <pre class="field-value"></pre>
    </section>
  </template>

  <div id="photoCropModal" class="crop-modal" hidden>
    <div class="crop-backdrop" data-close-crop></div>
    <section class="crop-dialog" role="dialog" aria-modal="true" aria-labelledby="cropTitle">
      <div class="crop-head">
        <div>
          <p class="eyebrow">PROFILE IMAGE</p>
          <h2 id="cropTitle">프로필 이미지 자르기</h2>
        </div>
        <button id="cropCloseBtn" class="ghost crop-x" type="button" aria-label="닫기">×</button>
      </div>
      <div class="crop-canvas-wrap">
        <canvas id="cropCanvas" width="360" height="360"></canvas>
      </div>
      <p class="crop-help">이미지를 드래그해서 위치를 맞추고, 아래 슬라이더로 확대/축소하세요.</p>
      <label class="crop-zoom">
        <span>확대</span>
        <input id="cropZoom" type="range" min="1" max="3" step="0.01" value="1" />
      </label>
      <div class="crop-actions">
        <button id="cropCancelBtn" class="secondary" type="button">취소</button>
        <button id="cropSaveBtn" type="button">적용</button>
      </div>
    </section>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app-profile-v2.js"></script>
</body>
</html>
